<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <title>Services</title>
    <link rel="stylesheet" href="/style2.css">
    <style>
  
#previousLink {
    display: inline-block;
    padding: 10px 20px;
    background-color:#007BFF; 
    color: black;
    text-decoration: none;
    border-radius: 5px;
    position: absolute;
    left: 10px; 
    bottom: 10px;
}
    </style>
  </head>
  <body>
    <h2>Providerd Services</h2>
      <div th:if="${#lists.isEmpty(services)}">
      <p>No services found for this provider</p>
    </div>
      <div th:if="${!#lists.isEmpty(services)}">
         <table >
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="service : ${services}">
          <td th:text="${service.id}">Id</td>
          <td th:text="${service.name}">Name</td>
          <td th:text="${service.description}">Description</td>
          <td th:text="${service.price}">0.00</td>
        
        </tr>
      </tbody>
    </table>
    
      </div>

     <!-- Delete a specific service -->
       <h2>Delete a service </h2>
  <form th:action="@{/services/delete}" method="post">
    <input type="text" name="serviceId" placeholder=" Enter Service Id" required>
    <button type="submit">Delete Service</button>
      <p th:if="${error}" th:text="${error}" id="error"></p>
    <p th:if="${success}" th:text="${success}" id="success"></p>

  </form>
  
      <a th:href="@{/previous/backToAdminPage}" id="previousLink">Previous</a>
  </body>
</html>
