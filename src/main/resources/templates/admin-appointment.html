<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Appointment System</title>
    <link rel="stylesheet" href="/style2.css">
     <style>
     #previousLink {
    display: inline-block;
    padding: 10px 20px;
    background-color:#007BFF; 
    color: black;
    text-decoration: none;
    border-radius: 5px;
    position: absolute;
    left: 10px; 
    bottom: 10px;
}
    </style>
  </head>
  <body>
    <h2>All Appointments</h2>
  <div th:if="${#lists.isEmpty(appointments)}">
    <p>There are no available appointments right now</p>
  </div>
  <div th:if="${!#lists.isEmpty(appointments)}">
    <table>
      <thead>
        <tr>
          <th>Appointments Id</th>
          <th>User ID</th>
          <th> Service Name</th>
          <th>Appointment Time</th>
          <th>Appointment Status</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="appointment : ${appointments}">
          <td th:text="${appointment.id}">Appointments Id</td>
          <td th:text="${appointment.user.id}">User ID</td>
          <td th:text="${appointment.service.name}"> Service Name</td>
          <td th:text="${appointment.appointment_time}">Appointment Time</td>
          <td th:text="${appointment.status}">Appointment StatuA</td>
          
        </tr>

      </tbody>
    </table>
  </div>
  <br>
 <a th:href="@{/previous/backToAdminPage}" id="previousLink"> Previous</a>

  </body>
</html>
