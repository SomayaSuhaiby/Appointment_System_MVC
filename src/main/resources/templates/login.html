
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Login</title>
    <link rel="stylesheet" href="/style.css">
    <style>

  #previousLink {
    display: inline-block;
    padding: 10px 20px;
    background-color:#007BFF; 
    color: black;
    text-decoration: none;
    border-radius: 5px;
    position: absolute;
    left: 10px; 
    bottom: 10px;
}

    </style>
  </head>
  <body>
     <h2>Login</h2>
    
   <form  class="form" method="POST" action="/users/login">
      <input type="email" name="email" placeholder="Email" required><br>
      <input type="password" name="password" placeholder="Password" required><br>
      <button type="submit">Login</button>
    </form>

    <!-- massage error here-->
    <p style="color:red;">
      <span th:if="${error}" th:text="${error}"></span>
    </p>
    
     <a th:href="@{/previous/backToIndexPage}" id="previousLink">Previous</a>
  </body>
</html>
