<<!DOCTYPE html>
    <html lang="en" xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <title>Available Services</title>

        <link rel="stylesheet" th:href="@{/style2.css}">

        <style>
            #previousLink {
                display: inline-block;
                padding: 10px 20px;
                background-color: #007BFF;
                color: black;
                text-decoration: none;
                border-radius: 5px;
                position: absolute;
                left: 10px;
                bottom: 10px;
            }

            #previousLink:hover {
                background-color: #0056b3;
            }

            .bookButton {
                padding: 8px 15px;
                background-color: #28a745;
                color: white;
                text-decoration: none;
                border-radius: 5px;
            }

            .bookButton:hover {
                background-color: #218838;
            }

            table {
                width: 100%;
                border-collapse: collapse;
            }

            th,
            td {
                padding: 12px;
                border: 1px solid #ccc;
                text-align: center;
            }
        </style>
    </head>

    <body>

        <h2>Available Services</h2>

        <!-- No available services -->
        <div th:if="${#lists.isEmpty(availablities)}">

            <p>There are no available services right now.</p>

        </div>


        <!-- Available services -->
        <div th:if="${!#lists.isEmpty(availablities)}">
            <table>
                <thead>
                    <tr>
                        <th>Service ID</th>
                        <th>Service</th>
                        <th>Service Provider</th>
                        <th>Start Time</th>
                        <th>End Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="available : ${availablities}">
                        <!-- Service ID -->
                        <td th:text="${available.service.id}">
                            Service ID
                        </td>
                        <!-- Service Name -->
                        <td th:text="${available.service != null
                        ? available.service.name
                        : 'No Service'}">
                            Service
                        </td>
                        <!-- Service Provider -->
                        <td th:text="${available.serviceProvider != null
                        ? available.serviceProvider.username
                        : 'No Provider'}">
                            Service Provider
                        </td>
                        <!-- Start Time -->
                        <td th:text="${available.start_time}">
                            Start Time
                        </td>
                        <!-- End Time -->
                        <td th:text="${available.end_time}">
                            End Time
                        </td>
                        <!-- Book Button -->
                        <td>

                            <form th:action="@{/user/appointment/book}" method="post">
                                <input type="hidden" name="availabilityId" th:value="${available.id}">
                                <button type="submit" class="bookButton"> Book </button>
                            </form>

                        </td>
                    </tr>
                </tbody>
            </table>
        </div>


        <!-- Error message -->
        <div th:if="${error}" th:text="${error}" id="error">
        </div>


        <!-- Success message -->
        <div th:if="${success}" th:text="${success}" id="success">
        </div>


        <!-- Previous button -->
        <a th:href="@{/previous/backToUserPage}" id="previousLink">
            Previous
        </a>

    </body>

    </html>
