<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>create service</title>
    <link rel="stylesheet" href="/style.css">
    <style>
        
    
  
  #previousLink {
    display: inline-block;
    padding: 10px 20px;
    background-color:#007BFF; 
    color: black;
    text-decoration: none;
    border-radius: 5px;
    position: absolute;
    left: 10px; 
    bottom: 10px;
}
       
    </style>
  </head>
  <body>
    
  <h3>Create a new service</h3>
  <form class="form" method="post" th:action="@{/services/create}">
    <input type="text" name="name" placeholder="Service Name" required>
    <input type="text" name="description" placeholder="Description" required>
    <input type="number" name="price" placeholder="Price" required>
    <button type="submit">Create Service</button>
  </form><br><br>


  <div th:if="${error}" th:text="${error}" id="error"></div>
  <div th:if="${success}" th:text="${success}" id="success"></div>

  <a th:href="@{/previous/backToAdminPage}" id="previousLink">Previous</a>
  </body>
</html>
